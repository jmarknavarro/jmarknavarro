<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1104" viewBox="0 0 1200 1104" role="img" aria-label="John Mark Navarro, software and embedded systems engineer. Projects: N2S-S1, 2-step rev limiter controller; N2S-AMS, Piggyback air suspension management; K8 Desk, Mac app for coding with Claude (k8desk.vercel.app); CineK8, Movies, shows and anime on Android and TV (cinek8.vercel.app); QRPinas, QR Ph payment cards for GCash and Maya (qrpinas.vercel.app); CineCaptions, Cinematic subtitles for images (cinecaptions.com). Stack: TypeScript, JavaScript, Dart, Kotlin, C++, Python, Java, React, Flutter, Vue, Electron, Vite, Tailwind CSS, Express, ESP32, Arduino, Android, Cloudflare Workers, Vercel.">
